[project]
name = "yeti-iga"
version = "0.2.0"
authors = [
    { name="Arnaud Duval", email="arnaud.duval@cnrs.fr" },
]
description = "Yeti is an IGA code"
readme =  "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Fortran",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2",
    "scipy>=1.13",
    "nlopt>=2",
    "geomdl>=5.3",
    "networkx>=3.0",
    "sympy>=1.12",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
fem = ["meshpy>=2022.1"]
all = ["matplotlib>=3.7", "meshpy>=2022.1"]

[project.optional-dependencies]
dev = ["nbstripout", "jupyter", "matplotlib"]

[project.urls]
Homepage = "https://lamcosplm.insa-lyon.fr/projects/yeti"
Issues = "https://lamcosplm.insa-lyon.fr/plugins/tracker/?tracker=626"

[build-system]
requires = ["scikit-build-core", "numpy", "pybind11", "meson", "ninja"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.args = ["-DBUILD_PYTHON_MODULE=ON"]
cmake.version = ">=3.17.2"
cmake.define = {pybind11_DIR = ""}
logging.level =  "INFO"
build-dir = "build/{wheel_tag}"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "cp36-* cp37-* cp38-*   *musllinux*"
archs = ["x86_64"]    #, "aarch64"]           # installer qemu-user-static pour l'arm64
manylinux-x86_64-image = "manylinux_2_28" # "manylinux2014"
before-build = "yum install -y blas-devel lapack-devel eigen3-devel"
test-command = "pytest {project}/benchs"
test-requires = ["pytest"]

[tool.ruff]
src = ["src"]
